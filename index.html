<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090a0e"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="WOD"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>WOD Smart Randomizer v16</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090a0e;color:#f5f6f8;font-family:system-ui,-apple-system,sans-serif}
.app{max-width:780px;margin:auto;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:950;letter-spacing:3px}.muted{color:#858d9d;font-size:11px}
.card{background:#14161d;border:1px solid #292d36;border-radius:18px;padding:15px;margin:10px 0}.hero{background:radial-gradient(circle at 100% 0,#2b2148,#14161d 58%);border-color:#3b3152}
.eyebrow{font-size:9px;letter-spacing:1.5px;font-weight:900;color:#a99bcf}h1{font-size:29px;margin:5px 0}.herohead{display:flex;justify-content:space-between}.badge{background:#271f3b;border:1px solid #51406f;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:900}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:9px;color:#8d94a3;font-weight:900;margin-bottom:5px}
select{width:100%;background:#1a1d25;color:#fff;border:1px solid #303541;border-radius:11px;padding:11px}.primary,.secondary{width:100%;padding:13px;border-radius:13px;margin-top:9px;font-weight:900}.primary{background:#8b6df6;color:white;border:0}.secondary{background:#181b22;border:1px solid #303541}
.row{display:flex;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid #252932}.row:last-child{border:0}.num{width:28px;height:28px;display:grid;place-items:center;background:#25202f;border-radius:8px;color:#c7baff;font-size:11px;font-weight:900}.grow{flex:1}.name{font-weight:850;font-size:14px}.meta{font-size:9px;color:#8d94a3;margin-top:4px}.icon{width:34px;height:32px;background:#191c23;border:1px solid #303541;border-radius:9px;color:#fff}.fav{color:#ffd45a}
.extra{display:flex;align-items:center;gap:9px;background:#17141f;border:1px solid #332b43;border-radius:13px;padding:10px;margin:9px 0}.extra b{font-size:9px;color:#9c91b9}.extra strong{flex:1;font-size:13px}
.bar{height:7px;background:#292d36;border-radius:99px;overflow:hidden;margin-top:12px}.fill{height:100%;background:linear-gradient(90deg,#55df88,#ffb454,#ff6675)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{font-size:8px;font-weight:900;border:1px solid #343947;background:#1b1e26;border-radius:99px;padding:5px 7px}
.reason{font-size:11px;color:#b8beca;line-height:1.5}.reason span{display:block;margin:3px 0}.feedback{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.feed,.muscle{padding:9px;border-radius:11px;background:#191c23;border:1px solid #303541;color:#fff;font-size:9px;font-weight:850}.feed.active,.muscle.on{background:#282040;border-color:#6b55ad}.muscles{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.view{display:none}.view.active{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;height:66px;background:#0d0e13ee;border-top:1px solid #282c35;display:flex;justify-content:center;backdrop-filter:blur(16px);z-index:10}.tabs button{flex:1;max-width:180px;background:none;border:0;color:#858c9b;font-size:9px;font-weight:900}.tabs button.active{color:#fff}.balance{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.bal{background:#191c23;border:1px solid #2b2f38;border-radius:11px;padding:9px}.bal b{font-size:17px;display:block}.bal span{font-size:8px;color:#858d9d}.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.stat{background:#191c23;border:1px solid #2b2f38;border-radius:13px;padding:13px}.stat b{font-size:20px;display:block}.stat span{font-size:9px;color:#8d94a3}
</style></head><body><div class="app">
<div class="top"><div><div class="logo">WOD</div><div class="muted">SMART RANDOMIZER</div></div><button class="icon" onclick="show('setup')">⚙️</button></div>
<section id="workout" class="view active"></section>
<section id="setup" class="view"><div class="card"><div class="eyebrow">GENERATOR</div><div class="grid">
<div class="field"><label>FORMAT</label><select id="format"><option value="rounds">FREE / ROUNDS</option><option value="emom">EMOM</option><option value="amrap">AMRAP</option></select></div>
<div class="field"><label>TARGET FATIGUE / 10</label><select id="fatigue"><option>3</option><option>5</option><option selected>7</option><option>9</option></select></div>
<div class="field"><label>EXERCISES</label><select id="count"><option>5</option><option selected>6</option><option>7</option><option>8</option><option>9</option></select></div>
<div class="field"><label>LOCATION</label><select id="location"><option value="gym">GYM</option><option value="outdoor">OUTDOOR</option></select></div>
</div><button class="primary" onclick="generate()">GENERATE WORKOUT</button></div>
<div class="card"><div class="eyebrow">BUY IN / CASH OUT</div><div class="grid"><div class="field"><label>BUY IN</label><select id="buy"><option value="off">OFF</option><option value="on">ON</option></select></div><div class="field"><label>CASH OUT</label><select id="cash"><option value="off">OFF</option><option value="on">ON</option></select></div></div></div></section>
<section id="history" class="view"><div class="card"><div class="eyebrow">HISTORY</div><div id="historyList"></div></div></section>
<section id="stats" class="view"><div class="card"><div class="eyebrow">WEEKLY BALANCE</div><div id="stats"></div></div></section>
<div class="tabs"><button class="active" onclick="show('workout')">WORKOUT</button><button onclick="show('history')">HISTORY</button><button onclick="show('stats')">BALANCE</button><button onclick="show('setup')">SETUP</button></div></div>
<script>
const D=[
["Pull Up","upper","back","biceps",5,"bar","pull"],["Chin Up","upper","biceps","back",5,"bar","pull"],["Dips","upper","chest","triceps",5,"dipbar","push"],["Push Up","upper","chest","triceps",4,"body","push"],["Close-Grip Push Up","upper","triceps","chest",4,"body","push"],["Hand Release Push Up","upper","chest","triceps",5,"body","push"],["Renegade Row","upper","back","core",6,"kb","pull"],["Inverted Row","upper","back","biceps",4,"bar","pull"],
["Goblet Squat","lower","quads","glutes",4,"kb","squat"],["Bulgarian Split Squat","lower","quads","glutes",6,"body","lunge"],["Deadlift","lower","hamstrings","glutes",7,"kb","hinge"],["Thruster","lower","quads","shoulders",8,"kb","squat"],["Step Up","lower","glutes","quads",4,"box","lunge"],
["Side Plank","core","obliques","core",3,"body","anti-lateral"],["Plank","static","core","shoulders",3,"body","anti-extension"],["Dead Hang","static","back","grip",3,"bar","pull"],["Wall Sit","static","quads","core",3,"body","squat"],["Sit Up","core","abs","hip flexors",3,"body","flexion"],["Leg Raise","core","abs","hip flexors",4,"body","flexion"],["Mountain Climber","hi","core","quads",6,"body","locomotion"],["Plank KB Drag","core","core","shoulders",5,"kb","anti-rotation"],["Hyperextension","core","lower back","glutes",4,"bench","hinge"],
["Burpee","hi","chest","quads",8,"body","locomotion"],["Box Jump","hi","quads","glutes",8,"box","squat"],["Jump Rope","hi","calves","quads",5,"rope","locomotion"],["KB Swing","hi","glutes","hamstrings",7,"kb","hinge"],["1-Handed KB Swing","hi","glutes","hamstrings",7,"kb","hinge"],["Battle Rope","hi","shoulders","arms",7,"rope","push"],["Run","hi","quads","calves",7,"outdoor","locomotion"],["Sprint","hi","quads","glutes",9,"outdoor","locomotion"],["Row","hi","back","legs",7,"machine","pull"],["Air Bike","hi","quads","core",7,"machine","locomotion"],["Slam Ball","hi","core","shoulders",7,"ball","rotation"],["Wall Ball","hi","quads","shoulders",7,"ball","squat"],["Russian Twist","core","obliques","abs",4,"kb","rotation"],["Kneeling KB Chop","core","obliques","shoulders",4,"kb","rotation"],["Banded Rotation","core","obliques","abs",3,"band","rotation"]].map(x=>({name:x[0],cat:x[1],primary:x[2],secondary:x[3],fatigue:x[4],req:x[5],pattern:x[6]}));
const K="wod_v16", load=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)), save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let H=load(K+"_history",[]),F=load(K+"_favs",[]),W=null,FB={feeling:null,muscles:[]};
const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)];
function pool(){let loc=$("location").value;return D.filter(e=>loc==="outdoor"||!["Run","Sprint"].includes(e.name))}
function weekly(){let a={upper:0,lower:0,core:0,hi:0};let cut=Date.now()-6048e5;H.filter(w=>new Date(w.date).getTime()>cut).forEach(w=>(w.exercises||[]).forEach(e=>a[e.cat]=(a[e.cat]||0)+1));return a}
function recent(e){let p=0;H.slice(0,12).forEach(w=>(w.exercises||[]).forEach(x=>{let d=(Date.now()-new Date(w.date))/864e5;if(x.name===e.name)p+=d<1?55:d<2?34:d<4?17:d<7?6:0;else if(x.primary===e.primary)p+=Math.max(0,8-d)}));return p}
function pair(a,b){if(!a||!b)return 0;if(a.cat==="hi"&&b.cat==="hi")return 99999;let p=0;if(a.cat===b.cat)p+=24;if(a.primary===b.primary)p+=32;if(a.primary===b.secondary||a.secondary===b.primary)p+=17;if(a.pattern===b.pattern)p+=16;return p}
function score(a){let s=0,t=+$("fatigue").value,w=weekly();a.forEach(e=>{s+=recent(e)*.55;if(e.cat==="upper"&&w.upper>=5)s+=18;if(e.cat==="lower"&&w.lower>=5)s+=18;if(e.cat==="hi"&&w.hi>=3)s+=12});for(let i=0;i<a.length;i++)s+=pair(a[i],a[(i+1)%a.length]);s+=Math.abs(a.reduce((x,e)=>x+e.fatigue,0)/a.length-t)*14;if(!a.some(e=>e.cat==="core"))s+=12;return s}
function valid(a){return a.every((e,i)=>pair(e,a[(i+1)%a.length])<99999)}
function generate(){
 let n=+$("count").value,base=pool(),best=[];
 for(let q=0;q<650;q++){let left=base.slice(),a=[];for(let i=0;i<n;i++){let c=left.map(e=>({e,p:recent(e)*.5+Math.random()*30+(a.length?pair(a.at(-1),e):0)+(i===n-1?pair(e,a[0])*1.2:0)})).sort((x,y)=>x.p-y.p).slice(0,8);a.push(pick(c).e);left=left.filter(x=>x.name!==a.at(-1).name)}if(valid(a))best.push({a,s:score(a)})}
best.sort((a,b)=>a.s-b.s);let top=best.slice(0,12),a=pick(top).a,W={date:new Date().toISOString(),format:$("format").value,location:$("location").value,intensity:+$("fatigue").value,exercises:a,buy:null,cash:null};let used=new Set(a.map(e=>e.name));if($("buy").value==="on"){let p=base.filter(e=>e.cat==="hi"&&!used.has(e.name));W.buy=pick(p);if(W.buy)used.add(W.buy.name)}if($("cash").value==="on"){let p=base.filter(e=>["hi","core","static"].includes(e.cat)&&!used.has(e.name));W.cash=pick(p)}FB={feeling:null,muscles:[]};render()}
function reroll(i){let base=pool(),used=new Set(W.exercises.map((e,j)=>j!==i?e.name:null)),o=[];base.filter(e=>!used.has(e.name)).forEach(e=>{let a=W.exercises.slice();a[i]=e;if(valid(a))o.push({e,s:score(a)+Math.random()*25})});o.sort((a,b)=>a.s-b.s);if(o[0]){W.exercises[i]=o[0].e;render()}}
function fav(n){F=F.includes(n)?F.filter(x=>x!==n):[...F,n];save(K+"_favs",F);render()}
function show(id){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".tabs button").forEach((b,i)=>b.classList.toggle("active",["workout","history","stats","setup"][i]===id));if(id==="history")hist();if(id==="stats")stats()}
function feel(x){FB.feeling=x;renderFeedback()}function muscle(x){FB.muscles=FB.muscles.includes(x)?FB.muscles.filter(m=>m!==x):[...FB.muscles,x];renderFeedback()}
function saveW(){let w=JSON.parse(JSON.stringify(W));w.feedback=FB;H.unshift(w);H=H.slice(0,100);save(K+"_history",H);alert("Workout saved");hist();stats()}
function renderFeedback(){if(!$("feedback"))return;let ms=["Chest","Back","Shoulders","Arms","Quads","Glutes","Hamstrings","Core"];$("feedback").innerHTML='<div class="eyebrow">POST-WORKOUT FEEDBACK</div><div class="feedback">'+["Too easy","Perfect","Too hard"].map(x=>`<button class="feed ${FB.feeling===x?"active":""}" onclick="feel('${x}')">${x}</button>`).join("")+'</div><div class="eyebrow" style="margin-top:12px">MUSCLES YOU FELT</div><div class="muscles">'+ms.map(x=>`<button class="muscle ${FB.muscles.includes(x)?"on":""}" onclick="muscle('${x}')">${x}</button>`).join("")+'</div>'}
function render(){
 let a=W.exercises,avg=a.reduce((x,e)=>x+e.fatigue,0)/a.length,w=weekly(),rs=[];if(!w.core)rs.push("Core was underrepresented in the last 7 days.");if(w.upper>w.lower+2)rs.push("Lower-body work was favored to balance your week.");rs.push("Recent exercises and repeated muscle loading were penalized.");rs.push("Adjacent and first/last exercises were checked as one circular sequence.");
 let h=`<div class="card hero"><div class="herohead"><div><div class="eyebrow">${W.format.toUpperCase()} · ${W.location.toUpperCase()}</div><h1>${a.length} EXERCISES</h1><div class="muted">Target fatigue ${W.intensity}/10</div></div><div class="badge">${avg.toFixed(1)}/10</div></div><div class="chips"><span class="chip">${a.filter(e=>e.cat==="core").length} CORE</span><span class="chip">${a.filter(e=>e.cat==="hi").length} CONDITIONING</span><span class="chip">${a.filter(e=>e.cat==="upper").length} UPPER</span><span class="chip">${a.filter(e=>e.cat==="lower").length} LOWER</span></div><div class="bar"><div class="fill" style="width:${Math.min(100,avg*10)}%"></div></div></div><div class="card"><div class="eyebrow">WHY THIS WORKOUT?</div><div class="reason">${rs.map(x=>`<span>• ${x}</span>`).join("")}</div></div>`;
 if(W.buy)h+=`<div class="extra"><b>BUY IN</b><strong>${W.buy.name}</strong><button class="icon" onclick="generate()">↻</button></div>`;
 h+='<div class="card">'+a.map((e,i)=>`<div class="row"><div class="num">${i+1}</div><div class="grow"><div class="name">${e.name}</div><div class="meta">${e.cat.toUpperCase()} · ${e.primary} + ${e.secondary} · ${e.pattern.toUpperCase()} · ${e.fatigue}/10</div></div><button class="icon ${F.includes(e.name)?"fav":""}" onclick="fav('${e.name.replaceAll("'","\\'")}')">★</button><button class="icon" onclick="reroll(${i})">↻</button></div>`).join("")+'</div>';
 if(W.cash)h+=`<div class="extra"><b>CASH OUT</b><strong>${W.cash.name}</strong><button class="icon" onclick="generate()">↻</button></div>`;
 h+='<div class="card"><div id="feedback"></div></div><button class="primary" onclick="saveW()">SAVE WORKOUT</button><button class="secondary" onclick="generate()">SMART REROLL</button>';$("workout").innerHTML=h;renderFeedback()}
function hist(){$("historyList").innerHTML=H.length?H.map(w=>`<div class="row"><div class="grow"><div class="name">${new Date(w.date).toLocaleDateString()} </div><div class="meta">${w.exercises.map(e=>e.name).join(" · ")}</div></div></div>`).join(""):"<div class='muted'>No saved workouts yet.</div>"}
function stats(){let w=weekly(),a=H.flatMap(x=>x.exercises||[]),avg=a.length?(a.reduce((x,e)=>x+e.fatigue,0)/a.length).toFixed(1):"—";$("stats").innerHTML=`<div class="balance">${["upper","lower","core","hi"].map(x=>`<div class="bal"><b>${w[x]}</b><span>${x==="hi"?"CONDITIONING":x.toUpperCase()}</span></div>`).join("")}</div><div class="statgrid"><div class="stat"><b>${H.length}</b><span>WORKOUTS</span></div><div class="stat"><b>${avg}</b><span>AVG FATIGUE</span></div></div>`}
generate();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{})); }</script></body></html>
